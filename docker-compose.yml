services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itapevi_em_dados
      POSTGRES_USER: itapevi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itapevi_dev_only}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - itapevi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itapevi -d itapevi_em_dados"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  itapevi_postgres_data:
