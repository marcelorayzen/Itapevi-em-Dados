name: Deploy public demonstration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - public-demo/**
      - .github/workflows/deploy-public-demo.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public demonstration
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

